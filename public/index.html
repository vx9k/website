<!doctype html>
<!--
  The site root. The site is a static export with no server code, so the
  language is picked here, before anything paints: a language chosen
  earlier with the header switcher (localStorage "vx-lang"), then the
  first of the browser's languages that the site has, then English.
  Without JavaScript, the refresh below sends visitors to English.
-->
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0808" />
    <title>vx</title>
    <link rel="alternate" hreflang="en-US" href="https://kthread.dev/en" />
    <link rel="alternate" hreflang="es-419" href="https://kthread.dev/es" />
    <link rel="alternate" hreflang="pt-BR" href="https://kthread.dev/pt" />
    <link rel="alternate" hreflang="x-default" href="https://kthread.dev/" />
    <script>
      (function () {
        var known = ["en", "es", "pt"];
        var lang = "en";
        try {
          var saved = localStorage.getItem("vx-lang");
          if (known.indexOf(saved) >= 0) lang = saved;
          else throw 0;
        } catch (e) {
          var langs = navigator.languages || [navigator.language || ""];
          for (var i = 0; i < langs.length; i++) {
            var p = String(langs[i]).toLowerCase().split("-")[0];
            if (known.indexOf(p) >= 0) { lang = p; break; }
          }
        }
        location.replace("/" + lang + location.hash);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/en" /></noscript>
    <style>
      html { background: #0c0808; color: #f5f1f0; font: 16px/1.5 system-ui, sans-serif; }
      body { margin: 0; padding: 2rem 1.25rem; }
      a { color: inherit; display: inline-block; min-height: 44px; line-height: 44px; margin-right: 1.5rem; }
    </style>
  </head>
  <body>
    <p>
      <a href="/en" hreflang="en-US" lang="en-US">English</a>
      <a href="/es" hreflang="es-419" lang="es-419">Español</a>
      <a href="/pt" hreflang="pt-BR" lang="pt-BR">Português</a>
    </p>
  </body>
</html>
